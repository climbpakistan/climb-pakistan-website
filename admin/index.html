<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climb Pakistan — Admin</title>
    <meta name="description" content="Admin dashboard for managing the Climb Pakistan sport climbing platform — news, athletes, rankings, competitions, records and more." />
    <!-- Open Graph + Twitter Card so shared admin links show a branded preview.
         og:image must be a raster PNG/JPG — WhatsApp and social platforms ignore SVG.
         Uses the main site's hosted og-default.png (absolute URL) since the admin
         deployment domain varies; a local copy also ships at /og-default.png. -->
    <meta property="og:site_name" content="Climb Pakistan" />
    <meta property="og:title" content="Climb Pakistan — Admin" />
    <meta property="og:description" content="Admin dashboard for managing the Climb Pakistan sport climbing platform — news, athletes, rankings, competitions, records and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.climbpakistan.com/" />
    <meta property="og:image" content="https://www.climbpakistan.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Climb Pakistan — Admin" />
    <meta name="twitter:description" content="Admin dashboard for managing the Climb Pakistan sport climbing platform." />
    <meta name="twitter:image" content="https://www.climbpakistan.com/og-default.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
