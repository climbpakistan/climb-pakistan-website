<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ⚠️ FAVICON — READ BEFORE EDITING

      These <link rel="icon"> tags are NOT included in the pre-rendered build.
      Vike does not preserve the favicon <link> tags from this file during
      `npm run build` (see dist/client/*.html) — the favicon is therefore
      declared AGAIN in pages/+Layout.jsx via vike-react/Head (<Head>).

      If you change the favicon (logo.svg / favicon.png), update BOTH places:
      1. Here (used by the dev server / Vite directly), and
      2. pages/+Layout.jsx — this is the version that actually ships.

      Without the +Layout.jsx copy, browsers fall back to a cached/old
      favicon and the site shows no icon on deployed pages.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong theme. Site default (and fallback) is the night theme.
      (function () {
        try {
          var stored = localStorage.getItem('climb-pakistan-theme');
          document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
